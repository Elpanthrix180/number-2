<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MARE</title>
<style>
:root{--bg:#05060f;--panel:#0d1024cc;--line:#1f2547;--txt:#e9ecff;--mut:#8b93c4;--acc:#7fd6ff;--acc2:#b48cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 85% -10%,#2a1e5c55,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0e3a5c55,transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);font:15px/1.5 system-ui,sans-serif}
header{display:flex;align-items:center;gap:24px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:.25em;display:flex;align-items:center;gap:10px}
.logo i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 12px 3px var(--acc),-14px 6px 18px 2px #7fd6ff66,-28px 12px 22px 1px #b48cff44}
.logo b{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#stars{position:fixed;inset:0;z-index:-1;pointer-events:none}
.comet{position:fixed;top:-10px;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 6px 2px var(--acc);z-index:-1;animation:fly 9s linear infinite}
.comet:after{content:"";position:absolute;right:1px;top:0;width:140px;height:1px;background:linear-gradient(90deg,transparent,#7fd6ffaa);transform-origin:right}
@keyframes fly{0%{transform:translate(0,0) rotate(-35deg);opacity:0}5%{opacity:1}30%{opacity:0;transform:translate(-700px,490px) rotate(-35deg)}100%{opacity:0;transform:translate(-700px,490px) rotate(-35deg)}}
nav button{background:none;border:0;color:var(--mut);font:inherit;padding:6px 10px;cursor:pointer;border-radius:8px}
nav button.on{color:var(--txt);background:var(--panel)}
.key{margin-left:auto;display:flex;gap:8px}
input,textarea,select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit}
main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 62px)}
@media(max-width:800px){main{grid-template-columns:1fr}}
aside{padding:20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
textarea{min-height:120px;resize:vertical;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;color:var(--mut)}
.chip.on{border-color:var(--acc);color:var(--acc)}
.go{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#05060f;box-shadow:0 0 24px #7fd6ff44;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;font-size:15px}
.go:disabled{opacity:.5}
section{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card img,.card video{width:100%;display:block;aspect-ratio:var(--ar,1);object-fit:cover;background:#000}
.card{position:relative}.del{position:absolute;top:8px;right:8px;background:#000a;color:#fff;border:0;border-radius:8px;width:28px;height:28px;cursor:pointer}
.dl{position:absolute;top:8px;right:42px;background:#000a;color:#fff;border:0;border-radius:8px;width:28px;height:28px;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--mut)}.bar button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:5px 10px;cursor:pointer}
.card p{margin:0;padding:10px 12px;font-size:13px;color:var(--mut)}
.load{aspect-ratio:1;display:grid;place-items:center;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:80px 20px}
#upwrap img{max-width:100%;border-radius:10px}
</style>
</head>
<body>
<canvas id="stars"></canvas><div class="comet" style="left:70%"></div><div class="comet" style="left:95%;animation-delay:4.5s"></div>
<header>
  <div class="logo"><i></i><b>MARE</b></div>
  <nav id="tabs">
    <button data-m="image" class="on">Imagen</button>
    <button data-m="video">Video</button>
    <button data-m="edit">Editar</button>
    <button data-m="avatar">Avatar</button>
    <button data-m="lipsync">Lipsync</button>
  </nav>
  <div class="key"><input id="key" type="password" placeholder="Clave API de fal.ai"></div>
</header>
<main>
<aside>
  <div><label>Prompt</label><textarea id="prompt" placeholder="Describe lo que quieres crear…"></textarea></div>
  <div id="upwrap" hidden><label>Imagen de entrada</label><input id="file" type="file" accept="image/*"><div id="prev"></div></div>
  <div id="vidwrap" hidden><label>Video de entrada</label><input id="vfile" type="file" accept="video/*"></div>
  <div id="audwrap" hidden><label>Voz: sube audio o deja vacío para usar el prompt como texto hablado</label><input id="afile" type="file" accept="audio/*"></div>
  <div><label>Modelo</label><select id="model" style="width:100%"></select></div>
  <div><label>Movimiento de cámara / estilo</label><div class="chips" id="presets"></div></div>
  <div><label>Formato</label><div class="chips" id="ratios"></div></div>
  <button class="go" id="go">Generar</button>
</aside>
<section><div class="bar"><span id="count"></span><button id="clear">Borrar historial</button></div><div class="grid" id="out"></div><div class="empty" id="empty">Tus creaciones aparecerán aquí, como cometas en el cielo.</div></section>
</main>
<script>
const MODELS={
  image:[["fal-ai/flux/schnell","FLUX Schnell"],["fal-ai/flux/dev","FLUX Dev"],["fal-ai/recraft-v3","Recraft V3"]],
  video:[["fal-ai/kling-video/v1.6/standard/text-to-video","Kling 1.6 (texto)"],["fal-ai/kling-video/v1.6/standard/image-to-video","Kling 1.6 (imagen)"],["fal-ai/minimax/video-01","MiniMax Video-01"]],
  edit:[["fal-ai/flux/dev/image-to-image","FLUX img2img"],["fal-ai/flux-pro/kontext","FLUX Kontext"]],
  avatar:[["fal-ai/bytedance/omnihuman","OmniHuman (foto que habla)"]],
  lipsync:[["fal-ai/sync-lipsync","Sync Lipsync"],["fal-ai/kling-video/lipsync/audio-to-video","Kling Lipsync"]]};
const PRESETS={
  image:["Cinematográfico","Retrato de estudio","Anime","Producto","Fotorrealista","Neón"],
  video:["Zoom in lento","Dolly out","Órbita 360","Grúa arriba","Cámara en mano","Bullet time","FPV dron","Crash zoom"],
  edit:["Cambiar fondo","Iluminación dorada","Estilo pintura","Blanco y negro"],avatar:[],lipsync:[]};
const RATIOS={image:["1:1","16:9","9:16","4:3"],video:["16:9","9:16","1:1"],edit:["1:1","16:9","9:16"],avatar:["9:16","1:1","16:9"],lipsync:["16:9","9:16","1:1"]};
const SIZE={"1:1":"square_hd","16:9":"landscape_16_9","9:16":"portrait_16_9","4:3":"landscape_4_3"};
let mode="image",preset=null,ratio="1:1",imgData=null,vidData=null,audData=null,files={};
const $=id=>document.getElementById(id);
try{$("key").value=localStorage.getItem("falkey")||""}catch(e){}
$("key").onchange=e=>{try{localStorage.setItem("falkey",e.target.value)}catch(_){}};
function chips(el,list,cur,set){el.innerHTML="";list.forEach(v=>{const c=document.createElement("span");c.className="chip"+(v===cur?" on":"");c.textContent=v;c.onclick=()=>{set(v===cur&&el.id==="presets"?null:v);render()};el.appendChild(c)})}
function render(){
  $("model").innerHTML=MODELS[mode].map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
  chips($("presets"),PRESETS[mode],preset,v=>preset=v);
  if(!RATIOS[mode].includes(ratio))ratio=RATIOS[mode][0];
  chips($("ratios"),RATIOS[mode],ratio,v=>ratio=v);
  $("upwrap").hidden=mode==="image"||mode==="lipsync";
  $("vidwrap").hidden=mode!=="lipsync";$("audwrap").hidden=!["avatar","lipsync"].includes(mode);
  $("presets").parentElement.hidden=!PRESETS[mode].length;
}
$("tabs").onclick=e=>{if(!e.target.dataset.m)return;mode=e.target.dataset.m;preset=null;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===e.target));render()};
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;files.img=f;const r=new FileReader();r.onload=()=>{imgData=r.result;$("prev").innerHTML=`<img src="${imgData}">`};r.readAsDataURL(f)};
$("vfile").onchange=e=>{const f=e.target.files[0];if(f){files.vid=f;vidData=true}};
$("afile").onchange=e=>{const f=e.target.files[0];if(f){files.aud=f;audData=true}};
// Sube el archivo al almacenamiento de fal y devuelve su URL publica (cache por archivo)
const upCache=new WeakMap();
async function upload(f,key){
  if(upCache.has(f))return upCache.get(f);
  const h={"Authorization":"Key "+key,"Content-Type":"application/json"};
  const i=await (await fetch("https://rest.alpha.fal.ai/storage/upload/initiate?storage_type=fal-cdn-v3",{method:"POST",headers:h,
    body:JSON.stringify({content_type:f.type||"application/octet-stream",file_name:f.name})})).json();
  if(!i.upload_url)throw new Error("Subida fallida: "+JSON.stringify(i));
  const put=await fetch(i.upload_url,{method:"PUT",headers:{"Content-Type":f.type||"application/octet-stream"},body:f});
  if(!put.ok)throw new Error("Subida fallida: HTTP "+put.status);
  upCache.set(f,i.file_url);return i.file_url;
}
async function fal(model,input,key){
  const h={"Authorization":"Key "+key,"Content-Type":"application/json"};
  const q=await (await fetch("https://queue.fal.run/"+model,{method:"POST",headers:h,body:JSON.stringify(input)})).json();
  if(!q.status_url)throw new Error(JSON.stringify(q));
  for(;;){await new Promise(r=>setTimeout(r,2500));
    const s=await (await fetch(q.status_url,{headers:h})).json();
    if(s.status==="COMPLETED")return (await fetch(q.response_url,{headers:h})).json();
    if(s.status==="FAILED"||s.error)throw new Error(JSON.stringify(s));}
}
$("go").onclick=async()=>{
  const key=$("key").value.trim(),model=$("model").value;
  let prompt=$("prompt").value.trim();if(preset)prompt+=(prompt?", ":"")+preset;
  if(!key)return alert("Introduce tu clave API de fal.ai");
  if(!prompt)return alert("Escribe un prompt");
  const talk=mode==="avatar"||mode==="lipsync";
  const needImg=mode==="edit"||mode==="avatar"||model.includes("image-to-video");
  if(needImg&&!imgData)return alert("Sube una imagen de entrada");
  if(mode==="lipsync"&&!vidData)return alert("Sube un video de entrada");
  if(talk&&!audData&&!prompt)return alert("Sube un audio o escribe el texto a decir");
  const input={prompt};
  if(mode==="image")input.image_size=SIZE[ratio];
  if(mode==="video")input.aspect_ratio=ratio;
  $("empty").hidden=true;
  const card=document.createElement("div");card.className="card";card.style.setProperty("--ar",ratio.replace(":","/"));
  card.innerHTML=`<div class="load">Generando…</div><p></p>`;card.querySelector("p").textContent=prompt;
  $("out").prepend(card);$("go").disabled=true;
  try{
    card.firstElementChild.textContent="Subiendo archivos…";
    const imgURL=needImg?await upload(files.img,key):null;
    if(needImg)input.image_url=imgURL;
    if(talk){let audio=files.aud?await upload(files.aud,key):null;
      if(!audio){card.firstElementChild.textContent="Generando voz…";
        const t=await fal("fal-ai/minimax/speech-02-hd",{text:prompt},key);audio=t.audio?.url;}
      card.firstElementChild.textContent="Animando…";
      for(const k in input)delete input[k];input.audio_url=audio;
      if(mode==="avatar")input.image_url=imgURL;else input.video_url=await upload(files.vid,key);}
    const r=await fal(model,input,key);
    const url=r.video?.url||r.images?.[0]?.url||r.image?.url;
    const it={url,video:!!r.video,prompt,ratio,mode,date:Date.now()};
    card.firstElementChild.outerHTML=media(it);addDel(card,it);hist.unshift(it);saveHist();
  }catch(err){card.firstElementChild.textContent="Error: "+err.message.slice(0,200)}
  finally{$("go").disabled=false}
};
// Historial guardado en el navegador
const HKEY="estudio-historial"; // se mantiene para conservar el historial existente
let hist=[];try{hist=JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){}
function saveHist(){try{localStorage.setItem(HKEY,JSON.stringify(hist))}catch(e){}updCount()}
function updCount(){const n=$("out").children.length;$("count").textContent=n?n+" creaciones":"";$("empty").hidden=n>0;$("clear").hidden=!hist.length}
function media(it){return it.video?`<video src="${it.url}" controls loop muted></video>`:`<a href="${it.url}" target="_blank"><img src="${it.url}"></a>`}
async function download(it){
  const ext=it.video?"mp4":(it.url.split("?")[0].match(/\.(png|jpe?g|webp)$/i)||[,"png"])[1];
  const name="mare-"+(it.mode||"creacion")+"-"+(it.date||Date.now())+"."+ext;
  try{const b=await (await fetch(it.url)).blob();const u=URL.createObjectURL(b);
    const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000);
  }catch(e){window.open(it.url,"_blank")}
}
function addDel(card,it){const d=document.createElement("button");d.className="dl";d.textContent="↓";d.title="Descargar";
  d.onclick=()=>download(it);card.appendChild(d);const b=document.createElement("button");b.className="del";b.textContent="×";b.title="Eliminar";
  b.onclick=()=>{hist=hist.filter(h=>h!==it);card.remove();saveHist()};card.appendChild(b)}
function showItem(it){const card=document.createElement("div");card.className="card";card.style.setProperty("--ar",it.ratio.replace(":","/"));
  card.innerHTML=media(it)+"<p></p>";card.querySelector("p").textContent=it.prompt;addDel(card,it);$("out").appendChild(card)}
hist.forEach(showItem);updCount();
$("clear").onclick=()=>{if(!confirm("¿Borrar todo el historial?"))return;hist=[];$("out").innerHTML="";saveHist()};
// Fondo de estrellas
(function(){const c=$("stars"),x=c.getContext("2d");function d(){c.width=innerWidth;c.height=innerHeight;
  for(let i=0;i<180;i++){x.fillStyle=`rgba(255,255,255,${Math.random()*.7+.1})`;x.fillRect(Math.random()*c.width,Math.random()*c.height,Math.random()<.1?2:1,Math.random()<.1?2:1)}}
  d();addEventListener("resize",d)})();
render();
</script>
</body>
</html>
