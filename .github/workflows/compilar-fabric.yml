name: Compilar Natural Disasters (Fabric)

on:
  push:
    paths:
      - 'natural-disasters-fabric/**'
      - '.github/workflows/compilar-fabric.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: natural-disasters-fabric
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        run: gradle build --no-daemon

      - name: Subir el JAR
        uses: actions/upload-artifact@v4
        with:
          name: panthrixs-natural-disasters-fabric-jar
          path: natural-disasters-fabric/build/libs/*.jar
